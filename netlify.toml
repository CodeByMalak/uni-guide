# NOTE: This project is live on Vercel (https://vercel.com/ayubi-s-projects/uni-guide).
# This netlify.toml is kept only as a backup configuration.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NPM_CONFIG_PRODUCTION = "false"
  # IMPORTANT: Set VITE_API_URL in the Netlify dashboard.
  # Go to: Site Settings -> Environment Variables -> Add variable
  #
  # Key:   VITE_API_URL
  # Value: https://your-backend.render.com/api
  #
  # Without this, the production frontend cannot reach the deployed backend.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
